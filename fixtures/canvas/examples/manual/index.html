<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Asyra Design SDK test page</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        font:
          15px system-ui,
          sans-serif;
        color: #202329;
      }
      header {
        display: flex;
        align-items: center;
        gap: 0.75rem 1.5rem;
        flex-wrap: wrap;
        padding: 0.75rem 1rem;
        border-bottom: 1px solid #ccc;
      }
      label {
        display: inline-flex;
        gap: 0.5rem;
        align-items: center;
      }
      select {
        font: inherit;
        padding: 0.25rem;
      }
      output {
        font:
          13px ui-monospace,
          monospace;
        overflow-wrap: anywhere;
      }
      main {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <label
        >Disabled features
        <select id="features" disabled>
          <option value="[]">None</option>
          <option value='["pen","text"]'>Pen and text</option>
          <option value='["rectangle"]'>Rectangle</option>
          <option value='["select"]'>Select</option>
        </select>
      </label>
      <label
        ><input id="hide-ui" type="checkbox" disabled /> Hide editor UI</label
      >
      <output id="status" aria-live="polite">Opening editor…</output>
    </header>
    <main></main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
