xt><text x="1380" y="315" font-size="18" fill="#24363c"></text><text x="1380" y="344" font-size="18" fill="#24363c">2  Preparation width 83.8.</text><text x="1380" y="373" font-size="18" fill="#24363c">    One cabinet door; uncut worktop.</text><text x="1380" y="402" font-size="18" fill="#24363c">    Small sink stored as reusable asset.</text><text x="1380" y="431" font-size="18" fill="#24363c"></text><text x="1380" y="460" font-size="18" fill="#24363c">3  Staggered countertop layout.</text><text x="1380" y="489" font-size="18" fill="#24363c">    P = plant at left rear.</text><text x="1380" y="518" font-size="18" fill="#24363c">    J = white pitcher at right rear.</text><text x="1380" y="547" font-size="18" fill="#24363c">    T = white tumbler at right front.</text><text x="1380" y="576" font-size="18" fill="#24363c">    Former straight-row gaps superseded.</text><text x="1380" y="605" font-size="18" fill="#24363c"></text><text x="1380" y="634" font-size="18" fill="#24363c">4  Dispenser remains at wall end.</text><text x="1380" y="663" font-size="18" fill="#24363c">    Fridge door sector clearance 5.2.</text><text x="1380" y="692" font-size="18" fill="#24363c"></text><text x="1380" y="721" font-size="18" fill="#24363c">5  Shelf remains 105 wide.</text><text x="1380" y="750" font-size="18" fill="#24363c">    Extends above left sink zone.</text><text x="1380" y="779" font-size="18" fill="#24363c">    Five items retain their sizes.</text><text x="1380" y="808" font-size="18" fill="#24363c"></text><text x="1380" y="837" font-size="18" fill="#24363c">Blue = fridge opening envelope.</text><text x="1380" y="866" font-size="18" fill="#24363c">Gold = cabinet door opening zones.</text></g></svg>