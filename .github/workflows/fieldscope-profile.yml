name: FieldScope profile group

on:
  workflow_call:
    inputs:
      files:
        description: Exact selected profile files as JSON
        required: true
        type: string
      group:
        description: One exact profile group
        required: true
        type: string

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn gen:turbo:check
      - name: Build FieldScope dependencies and app
        run: yarn turbo run react:build --filter=@asyra/fieldscope --concurrency=2
      - name: Verify profile supervision contracts
        run: node --test apps/fieldscope/scripts/__tests__/supervise-tests.test.mjs apps/fieldscope/scripts/__tests__/run-profile-groups.test.mjs
      - name: Run selected profile group
        env:
          PROFILE_FILES: ${{ inputs.files }}
          PROFILE_GROUP: ${{ inputs.group }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          files = json.loads(os.environ['PROFILE_FILES'])
          if not isinstance(files, list) or not files or any(not isinstance(f, str) for f in files):
              raise SystemExit('Invalid selected profile files')
          subprocess.run(['python3', 'apps/fieldscope/scripts/run-profile-groups.py', '--group', os.environ['PROFILE_GROUP'], *[arg for f in files for arg in ('--file', f)]], check=True)
          PYTHON
      - name: Upload profile supervision artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fieldscope-profile-${{ inputs.group }}
          path: apps/fieldscope/.artifacts/test-supervision/
          include-hidden-files: true
          if-no-files-found: ignore
