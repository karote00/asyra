name: Asyra FieldScope profile group

on:
  workflow_call:
    inputs:
      files:
        description: Exact selected profile files as JSON
        required: true
        type: string
      group:
        description: One exact profile group
        required: true
        type: string

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    # Preserve the supervisor's 20-minute process limit plus setup and artifact time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        file: ${{ fromJSON(inputs.group == 'heavy' && inputs.files || '[""]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - run: yarn gen:turbo:check
      - name: Build Asyra FieldScope dependencies and app
        run: yarn turbo run react:build --filter=@asyra/asyra-fieldscope --concurrency=2
      - name: Verify profile supervision contracts
        run: node --test apps/asyra-fieldscope/scripts/__tests__/supervise-tests.test.mjs apps/asyra-fieldscope/scripts/__tests__/run-profile-groups.test.mjs
      - name: Run selected profile group
        env:
          PROFILE_FILES: ${{ inputs.files }}
          PROFILE_GROUP: ${{ inputs.group }}
          PROFILE_FILE: ${{ matrix.file }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          files = json.loads(os.environ['PROFILE_FILES'])
          if not isinstance(files, list) or not files or any(not isinstance(f, str) for f in files):
              raise SystemExit('Invalid selected profile files')
          selected = os.environ['PROFILE_FILE']
          if selected:
              if selected not in files:
                  raise SystemExit('Matrix profile is outside the selected files')
              files = [selected]
          subprocess.run(['python3', 'apps/asyra-fieldscope/scripts/run-profile-groups.py', '--group', os.environ['PROFILE_GROUP'], *[arg for f in files for arg in ('--file', f)]], check=True)
          PYTHON
      - name: Upload profile supervision artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fieldscope-profile-${{ inputs.group }}-${{ strategy.job-index }}
          path: apps/asyra-fieldscope/.artifacts/test-supervision/
          include-hidden-files: true
          if-no-files-found: ignore
