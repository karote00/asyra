name: Apps - Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apps-cloudflare-production
  cancel-in-progress: false

env:
  SOURCE_SHA: ${{ github.sha }}
  VITE_COLLABORATION_WS_URL: ''

jobs:
  build:
    if: >-
      github.repository_id == '893098287' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Install locked dependencies
        run: corepack enable && yarn install --immutable
      - name: Audit dependencies before building a public artifact
        run: yarn security:audit
      - name: Check deployment contracts
        run: node --test scripts/__tests__/app-cloudflare.test.mjs .github/__tests__/app-cloudflare.test.mjs
      - name: Build frontend Apps with shared workspace dependencies
        run: |
          yarn gen:turbo:check
          yarn turbo run @asyra/asyra-design#react:build @asyra/fieldscope#react:build @asyra/asyra-sim#react:build --concurrency=2
          yarn workspace @asyra/asyra-design typecheck
      - name: Prepare isolated static artifacts
        run: node scripts/app-cloudflare.mjs prepare
      - name: Verify production artifacts without backend services
        env:
          APP_ARTIFACT_ROOT: tmp/cloudflare-apps
        run: node --test --test-concurrency=1 '--test-name-pattern=^(Design|Sim|FieldScope) production ' scripts/__tests__/production-artifacts.browser.test.mjs
      - name: Retain verified artifacts from this exact run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: apps-static-${{ env.SOURCE_SHA }}
          path: tmp/cloudflare-apps/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: asyra-design
            project: asyra-design
          - app: fieldscope
            project: asyra-fieldscope
          - app: asyra-sim
            project: asyra-sim
    environment:
      name: website-production
      url: https://${{ matrix.project }}.pages.dev
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
      - name: Do not publish an obsolete main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          current_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if [ "$current_sha" = "$SOURCE_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
            mkdir -p tmp/cloudflare-cli
            printf '{"private":true}\n' > tmp/cloudflare-cli/package.json
          else
            echo 'Skipped: main advanced; manually start a new run from current main.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: steps.current.outputs.publish == 'true'
        with:
          name: apps-static-${{ env.SOURCE_SHA }}
          path: tmp/cloudflare-apps/
      - name: Ensure the fixed Direct Upload project exists
        if: steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOYED_APP: ${{ matrix.app }}
        run: node scripts/app-cloudflare.mjs ensure-project "$DEPLOYED_APP"
      - name: Upload verified static files
        if: steps.current.outputs.publish == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.149.0'
          packageManager: npm
          workingDirectory: tmp/cloudflare-cli
          command: pages deploy ../cloudflare-apps/${{ matrix.app }} --project-name=${{ matrix.project }} --branch=main --commit-hash=${{ env.SOURCE_SHA }}
      - name: Verify public production App
        if: steps.current.outputs.publish == 'true'
        env:
          DEPLOYED_APP: ${{ matrix.app }}
        run: node scripts/app-cloudflare.mjs verify "$DEPLOYED_APP"
      - name: Record publication
        if: steps.current.outputs.publish == 'true'
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.pages-deployment-id }}
          DEPLOYED_PROJECT: ${{ matrix.project }}
        run: |
          printf 'Source: `%s`\n\nCloudflare deployment: `%s`\n\nProduction: https://%s.pages.dev\n' "$SOURCE_SHA" "$DEPLOYMENT_ID" "$DEPLOYED_PROJECT" >> "$GITHUB_STEP_SUMMARY"
