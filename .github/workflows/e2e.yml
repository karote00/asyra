name: E2E Tests

on:
  workflow_call:
    inputs:
      selected_suites:
        type: string
        default: '["collaboration","flow-inspector-board","functional","render-contracts"]'
    outputs:
      design-result:
        value: ${{ jobs.e2e-tests.result }}
      collaboration-result:
        value: ${{ jobs.collaboration-e2e-tests.result }}
      design-evidence:
        value: ${{ jobs.e2e-tests.outputs.evidence }}
      collaboration-evidence:
        value: ${{ jobs.collaboration-e2e-tests.outputs.evidence }}
      board-result:
        value: ${{ jobs.flow-inspector-board.result }}
      render-contracts-result:
        value: ${{ jobs.render-contracts.result }}
  workflow_dispatch:
    inputs:
      selected_suites:
        description: JSON array of E2E suites to run
        required: false
        type: string
        default: '["collaboration","flow-inspector-board","functional","render-contracts"]'
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flow-inspector-board:
    if: ${{ contains(fromJSON(inputs.selected_suites || '["collaboration","flow-inspector-board","functional","render-contracts"]'), 'flow-inspector-board') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build Asyra Design for Flow Inspector app proofs
        run: yarn turbo run react:build --filter=@asyra/asyra-design... --concurrency=2
      - name: Build Design services for original Playwright observation tests
        run: |
          yarn workspace @asyra/asyra-design build:document-backend
          yarn workspace @asyra/asyra-design build:collaboration-server

      - name: Verify Flow Inspector board
        env:
          FLOW_PROOF_URL: http://127.0.0.1:4318
          FLOW_PROOF_BROWSER_CHANNEL: chrome
        run: |
          node --test --test-concurrency=1 tools/flow-inspector/control-plane/__tests__/board*.test.cjs
          yarn workspace @asyra/flow-inspector test:flow-ui

  render-contracts:
    if: ${{ contains(fromJSON(inputs.selected_suites || '["collaboration","flow-inspector-board","functional","render-contracts"]'), 'render-contracts') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run render contracts and collect timing observations
        env:
          E2E_SUITE: render-contracts
        run: bash scripts/run-e2e.sh

  e2e-tests:
    outputs:
      evidence: ${{ steps.flow-results.outputs.evidence }}
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/tmp/playwright-runtime
      FLOW_RESULT_REPOSITORY: ${{ github.repository }}
      FLOW_RESULT_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      FLOW_RESULT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FLOW_RESULT_INTEGRATION: ${{ github.sha }}
      FLOW_RESULT_RUN: ${{ github.run_id }}
      FLOW_RESULT_ATTEMPT: ${{ github.run_attempt }}
    if: ${{ contains(fromJSON(inputs.selected_suites || '["collaboration","flow-inspector-board","functional","render-contracts"]'), 'functional') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    # The serial functional inventory can exceed 30m on a slower runner.
    # Keep per-test timeouts and fail-fast; allow setup and report cleanup too.
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Install declared Playwright recording runtime
        run: yarn workspace @asyra/asyra-design exec playwright install ffmpeg

      - name: Prepare offline native test client
        env:
          npm_config_cache: ${{ github.workspace }}/tmp/npm-cache
        run: |
          native_version="$(node --input-type=module -e "import { nativeTestClientVersion } from './apps/asyra-design/scripts/native-client-admission.mjs'; process.stdout.write(nativeTestClientVersion.replace('codex-cli ', ''))")"
          npm install --prefix "$GITHUB_WORKSPACE/tmp/native-test-client" --no-save --package-lock=false "@openai/codex@$native_version"
          export NATIVE_DELIVERY_CODEX="$GITHUB_WORKSPACE/tmp/native-test-client/node_modules/.bin/codex"
          node --input-type=module -e "import { resolveNativeTestExecutable } from './apps/asyra-design/scripts/native-client-admission.mjs'; resolveNativeTestExecutable()"
          printf 'NATIVE_DELIVERY_CODEX=%s\n' "$NATIVE_DELIVERY_CODEX" >> "$GITHUB_ENV"

      - name: Run E2E Tests
        env:
          E2E_SUITE: functional
          FLOW_CI_REPORT: ${{ github.workspace }}/tmp/flow-ci/design.json
        run: bash scripts/run-e2e.sh

      - name: Export complete design observation bundle
        if: ${{ always() }}
        run: node tools/flow-inspector/control-plane/observation-files.cjs export tmp/flow-ci/bundle

      - name: Upload complete design observation bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-observations-design-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/flow-ci/bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Retain Design observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/flow-ci/*.json
            tmp/flow-inspector/test-results/
            apps/asyra-design/test-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Collect Design flow results
        id: flow-results
        if: ${{ always() }}
        run: node tools/flow-inspector/control-plane/workflow-results.cjs collect design tmp/flow-ci/design.json

  collaboration-e2e-tests:
    outputs:
      evidence: ${{ steps.flow-results.outputs.evidence }}
    env:
      FLOW_RESULT_REPOSITORY: ${{ github.repository }}
      FLOW_RESULT_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      FLOW_RESULT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FLOW_RESULT_INTEGRATION: ${{ github.sha }}
      FLOW_RESULT_RUN: ${{ github.run_id }}
      FLOW_RESULT_ATTEMPT: ${{ github.run_attempt }}
    if: ${{ contains(fromJSON(inputs.selected_suites || '["collaboration","flow-inspector-board","functional","render-contracts"]'), 'collaboration') && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace
        run: yarn react:build

      - name: Run Collaboration E2E Tests
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: ${{ github.workspace }}/tmp/flow-ci/collaboration.json
        run: yarn workspace @asyra/asyra-design test:e2e:collaboration --reporter=line,json

      - name: Collect collaboration flow results
        id: flow-results
        if: ${{ always() }}
        run: node tools/flow-inspector/control-plane/workflow-results.cjs collect collaboration tmp/flow-ci/collaboration.json

      - name: Export complete collaboration observation bundle
        if: ${{ always() }}
        run: node tools/flow-inspector/control-plane/observation-files.cjs export tmp/flow-ci/bundle

      - name: Upload complete collaboration observation bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flow-observations-collaboration-${{ github.run_id }}-${{ github.run_attempt }}
          path: tmp/flow-ci/bundle/
          if-no-files-found: error
          retention-days: 7

      - name: Retain collaboration observation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collaboration-observations-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tmp/flow-ci/*.json
            tmp/flow-inspector/test-results/
            apps/asyra-design/test-results/
          if-no-files-found: warn
