name: Production Artifacts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_call:
    inputs:
      apps:
        description: JSON array of planned App IDs; empty runs all Apps for PR CI
        type: string
        default: ''

permissions:
  contents: read

jobs:
  production-artifact-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_APPS: ${{ inputs.apps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: yarn
      - run: yarn install --immutable
      - name: Install the existing Playwright browser
        run: yarn workspace @asyra/asyra-design playwright install --with-deps chromium
      - name: Build production artifacts
        run: node scripts/app-release-verification.mjs build
      - name: Test production artifacts without dev servers
        run: node scripts/app-release-verification.mjs test
