name: Plan workflow tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  plan-workflow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify task context and closeout contracts
        run: node --test scripts/__tests__/task-context.test.mjs scripts/__tests__/plan-closeout.test.mjs
