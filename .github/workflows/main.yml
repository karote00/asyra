name: CI

on:
  workflow_call:
    inputs:
      run_balanced_ai_correctness:
        type: boolean
        default: false
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]

permissions:
  contents: read

jobs:
  scope:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      evidence: ${{ steps.scope.outputs.evidence }}
      workspace_matrix: ${{ steps.scope.outputs.workspace_matrix }}
      relationship_map_digest: ${{ steps.scope.outputs.relationship_map_digest }}
      framework_declaration_tasks: ${{ steps.scope.outputs.framework_declaration_tasks }}
      framework_release_required: ${{ steps.scope.outputs.framework_release_required }}
      create_app_packages: ${{ steps.scope.outputs.create_app_packages }}
      design_e2e_required: ${{ steps.scope.outputs.design_e2e_required }}
      flow_inspector_validation_required: ${{ steps.scope.outputs.flow_inspector_validation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Classify changed workspaces and consumers
        id: scope
        env:
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CI_SCOPE_DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CI_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-scope.mjs

  shared-validation:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: scope
    runs-on: ubuntu-latest
    outputs:
      create_app_result: ${{ steps.create_app.outcome }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Require Changeset record
        if: github.event_name == 'pull_request'
        env:
          CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGESET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn changeset:pr:check

      - name: Audit high-severity dependencies
        run: yarn security:audit

      - name: Validate workspace dependencies
        run: yarn deps:validate

      - name: Validate turbo.json
        run: yarn gen:turbo:check

      - name: Lint
        run: yarn lint:ci

      - name: Build Framework declarations
        env:
          FRAMEWORK_DECLARATION_TASKS: ${{ needs.scope.outputs.framework_declaration_tasks }}
        run: |
          read -r -a tasks <<< "$FRAMEWORK_DECLARATION_TASKS"
          if [ ${#tasks[@]} -gt 0 ]; then yarn turbo run "${tasks[@]}" --concurrency=2; fi

      - name: Test repository scripts
        run: yarn test:scripts

      - name: Validate affected create-app package archives
        id: create_app
        if: ${{ needs.scope.outputs.create_app_packages != '' }}
        env:
          CREATE_APP_PACKAGES: ${{ needs.scope.outputs.create_app_packages }}
        run: |
          for package_directory in $CREATE_APP_PACKAGES; do
            npm pack --dry-run --json "./$package_directory" > /dev/null
          done

  workspace-validation:
    needs: scope
    if: ${{ always() && needs.scope.outputs.workspace_matrix != '[]' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        workspace: ${{ fromJson(needs.scope.outputs.workspace_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Build then test the selected workspace
        env:
          CI_WORKSPACE_MATRIX_ITEM: ${{ toJSON(matrix.workspace) }}
          CI_RELATIONSHIP_MAP_DIGEST: ${{ needs.scope.outputs.relationship_map_digest }}
          CI_SCOPE_REPOSITORY: ${{ github.repository }}
          CI_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          CI_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_SCOPE_INTEGRATION: ${{ github.sha }}
          CI_SCOPE_RUN: ${{ github.run_id }}
          CI_SCOPE_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/run-workspace-checks.mjs
      - name: Upload this workspace result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-result-${{ matrix.workspace.artifactId }}
          path: .ci-workspace-results/${{ matrix.workspace.artifactId }}.json
          if-no-files-found: ignore

  flow-inspector-validation:
    needs: [scope, workspace-validation]
    if: ${{ always() && needs.scope.outputs.flow_inspector_validation_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: yarn
      - run: yarn install --immutable
      - name: Test Flow Inspector control-plane contracts
        run: |
          node --test --test-concurrency=1 tools/flow-inspector/control-plane/__tests__/{contracts,snapshot,runner,evidence,store,service,server,mapping,cli,evolution,ci-context,ci-evidence,operations,agent-contract,agent-provider,agent-transport,agent-task,agent-verifier,pr-review,github-delivery,workflow-results,flow-target}.test.cjs
          node tools/flow-inspector/control-plane/cli.cjs prove
          node tools/flow-inspector/control-plane/cli.cjs ci-trial

  framework-release-readiness:
    if: ${{ always() && needs.scope.outputs.framework_release_required == 'true' && needs.shared-validation.result == 'success' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: [scope, shared-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build release packages
        run: yarn react:build

      - name: Pack and validate release packages
        run: yarn release:packages --prebuilt

      - name: Verify packed clean consumer
        run: yarn release:consumer

      - name: Verify release records
        run: yarn release:records

  design-e2e:
    if: ${{ always() && needs.scope.outputs.design_e2e_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    needs: scope
    uses: ./.github/workflows/e2e.yml
    with:
      run_balanced_ai_correctness: ${{ inputs.run_balanced_ai_correctness || false }}

  e2e-tests:
    needs: [scope, design-e2e]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      FLOW_PRODUCER_RESULT: ${{ needs.design-e2e.outputs.design-result }}
      DESIGN_SELECTED: ${{ needs.scope.outputs.design_e2e_required == 'true' }}
      DESIGN_E2E_WORKFLOW_RESULT: ${{ needs.design-e2e.result }}
    steps:
      - name: Require selected Design E2E producer
        run: |
          if [ "$DESIGN_SELECTED" = true ]; then test "$DESIGN_E2E_WORKFLOW_RESULT" = success && test "$FLOW_PRODUCER_RESULT" = success; else test "$DESIGN_E2E_WORKFLOW_RESULT" = skipped; fi

  collaboration-e2e-tests:
    needs: [scope, design-e2e]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 1
    env:
      FLOW_PRODUCER_RESULT: ${{ needs.design-e2e.outputs.collaboration-result }}
      DESIGN_SELECTED: ${{ needs.scope.outputs.design_e2e_required == 'true' }}
      DESIGN_E2E_WORKFLOW_RESULT: ${{ needs.design-e2e.result }}
    steps:
      - name: Require selected collaboration E2E producer
        run: |
          if [ "$DESIGN_SELECTED" = true ]; then test "$DESIGN_E2E_WORKFLOW_RESULT" = success && test "$FLOW_PRODUCER_RESULT" = success; else test "$DESIGN_E2E_WORKFLOW_RESULT" = skipped; fi

  validate:
    needs:
      [
        scope,
        shared-validation,
        workspace-validation,
        flow-inspector-validation,
        framework-release-readiness,
        design-e2e,
        e2e-tests,
        collaboration-e2e-tests
      ]
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLOW_RESULT_REPOSITORY: ${{ github.repository }}
      FLOW_RESULT_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
      FLOW_RESULT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      FLOW_RESULT_INTEGRATION: ${{ github.sha }}
      FLOW_RESULT_RUN: ${{ github.run_id }}
      FLOW_RESULT_ATTEMPT: ${{ github.run_attempt }}
      FLOW_SCOPE_EVIDENCE: ${{ needs.scope.outputs.evidence }}
      FLOW_WORKSPACE_VALIDATION_RESULT: ${{ needs.workspace-validation.result }}
      FLOW_WORKSPACE_RESULTS_DIR: .ci-workspace-results
      FLOW_FLOW_INSPECTOR_VALIDATION_RESULT: ${{ needs.flow-inspector-validation.result }}
      FLOW_FRAMEWORK_RELEASE_RESULT: ${{ needs.framework-release-readiness.result }}
      FLOW_CREATE_APP_READINESS_RESULT: ${{ needs.shared-validation.outputs.create_app_result }}
      FLOW_DESIGN_FORWARDER_RESULT: ${{ needs.e2e-tests.result }}
      FLOW_COLLABORATION_FORWARDER_RESULT: ${{ needs.collaboration-e2e-tests.result }}
      FLOW_VALIDATE_RESULT: ${{ needs.shared-validation.result }}
      FLOW_E2E_RESULT: ${{ needs.design-e2e.result }}
      FLOW_DESIGN_SELECTED: ${{ needs.scope.outputs.design_e2e_required }}
      FLOW_DESIGN_EVIDENCE: ${{ needs.design-e2e.outputs.design-evidence }}
      FLOW_COLLABORATION_EVIDENCE: ${{ needs.design-e2e.outputs.collaboration-evidence }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Download workspace matrix results
        if: always() && needs.scope.outputs.workspace_matrix != '[]'
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: workspace-result-*
          path: .ci-workspace-results
          merge-multiple: true
      - name: Aggregate selected CI scope and completed flow results
        run: node tools/flow-inspector/control-plane/workflow-results.cjs aggregate
