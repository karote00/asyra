name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Require Changeset record
        if: github.event_name == 'pull_request'
        env:
          CHANGESET_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CHANGESET_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: yarn changeset:pr:check

      - name: Audit high-severity dependencies
        run: yarn security:audit

      - name: Validate workspace dependencies
        run: yarn deps:validate

      - name: Validate turbo.json
        run: yarn gen:turbo:check

      - name: Build React
        run: yarn react:build

      - name: Lint
        run: yarn lint:ci

      - name: Test
        if: success()
        # Each workspace also owns test workers; avoid multiplying both pools.
        run: yarn test:ci --concurrency=2

      - name: Verify Flow Inspector core proof
        env:
          FLOW_CI_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
          FLOW_CI_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          FLOW_CI_EMIT_EVIDENCE: '1'
        run: |
          node --test --test-concurrency=1 tools/flow-inspector/control-plane/__tests__/{contracts,snapshot,runner,evidence,store,service,server,mapping,cli,evolution,ci-context,ci-evidence,operations,agent-contract,agent-task,agent-verifier}.test.cjs
          node tools/flow-inspector/control-plane/cli.cjs prove
          node tools/flow-inspector/control-plane/cli.cjs ci-trial

  framework-release-readiness:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Yarn
        run: corepack enable && yarn set version 4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build release packages
        run: yarn react:build

      - name: Pack and validate release packages
        run: yarn release:packages --prebuilt

      - name: Verify packed clean consumer
        run: yarn release:consumer

      - name: Verify release records
        run: yarn release:records
