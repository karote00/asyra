<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Canvas editor</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        font:
          14px system-ui,
          sans-serif;
        color: #202832;
        background: #fff;
      }
      nav {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 4px;
        padding: 6px;
        border-bottom: 1px solid #ccd3da;
      }
      button {
        background: white;
        border: 1px solid #aab5c0;
        border-radius: 5px;
        padding: 5px 10px;
        color: inherit;
        cursor: pointer;
      }
      button[aria-pressed='true'] {
        background: #204d77;
        color: white;
      }
      output {
        padding-inline: 6px;
      }
      main {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        touch-action: none;
      }
      canvas {
        display: block;
      }
      #preview {
        position: absolute;
        pointer-events: none;
        border: 1px dashed #204d77;
        background: #3670a323;
      }
    </style>
  </head>
  <body>
    <nav aria-label="Canvas tools" inert>
      <button aria-pressed="true">Rectangle</button
      ><button aria-pressed="false">Select</button><button>Undo</button
      ><button>Redo</button><output aria-live="polite">Starting…</output>
    </nav>
    <main aria-label="Drawing surface"><div id="preview" hidden></div></main>
  </body>
</html>
